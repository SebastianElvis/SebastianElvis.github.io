<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arcade</title>
    <style>
        html, body, #game { width: 100%; height: 100%; margin: 0; background: #111; color: #fff; }
        body { font: 14px/1.5 Tahoma, Arial, sans-serif; }
        #message { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; }
        #message[hidden], [hidden] { display: none !important; }
        #message p { max-width: 32em; }
        button { padding: 10px 20px; font: inherit; cursor: pointer; }
        button:focus-visible, input:focus-visible, .ejs_start_button:focus-visible { outline: 3px solid #f5c449; outline-offset: 3px; }
    </style>
    <script src="./arcade.js" defer></script>
</head>
<body>
    <div id="game"></div>
    <div id="message">
        <p id="status" role="status">The arcade checks the game files.</p>
        <button id="retry" hidden>Retry</button>
    </div>
    <noscript>You must enable JavaScript to play the game.</noscript>
</body>
</html>
